  @keyframes grain{

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ════════════════════════════════════════════════════════════════
   ⚡ STORM ENGINE — all lightning is drawn in code on a canvas.
   Fractal channels (midpoint displacement), tapered white-hot core
   inside lilac + violet glow, recursive branches, multi-restrike
   flicker envelopes, and an ambient storm layer of distant flashes.
   ════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('storm');
const cx = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth = window.innerWidth;
  H = cv.clientHeight = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cx.setTransform(DPR,0,0,DPR,0,0);
}
resize(); addEventListener('resize', resize);

const rnd = (a,b)=>a+Math.random()*(b-a);

/* jagged channel via midpoint displacement */
function frag(x0,y0,x1,y1,rough=.16,iters=7){
  let pts=[[x0,y0],[x1,y1]];
  for(let k=0;k<iters;k++){
    const nxt=[pts[0]];
    for(let i=0;i<pts.length-1;i++){
      const [ax,ay]=pts[i],[bx,by]=pts[i+1];
      const mx=(ax+bx)/2, my=(ay+by)/2;
      const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy)||1;
      const off=rnd(-1,1)*L*rough;
      nxt.push([mx - dy/L*off, my + dx/L*off],[bx,by]);
    }
    pts=nxt;
  }
  return pts;
}

let strikes=[], rafOn=false, stormLevel=0;

function spawn(o){
  const pts = frag(o.x0,o.y0,o.x1,o.y1, o.rough??.16, o.iters??7);
  const brs=[];
  const nb = o.branches ?? 6;
  for(let i=0;i<nb;i++){
    const idx = Math.floor(rnd(pts.length*.15, pts.length*.85));
    const [px,py]=pts[idx], [qx,qy]=pts[Math.min(idx+1,pts.length-1)];
    const base=Math.atan2(qy-py,qx-px);
    const ang = base + rnd(.35,1.0)*(Math.random()<.5?-1:1);
    const len = rnd(60,190)*(o.scale??1);
    brs.push(frag(px,py, px+Math.cos(ang)*len, py+Math.sin(ang)*len, .22, 5));
  }
  strikes.push({pts, brs, born:performance.now(),
    dur:o.dur??560, scale:o.scale??1, peak:o.peak??1,
    restrikes:o.restrikes??2, phase:rnd(0,10), sheet:false});
  if(!rafOn){ rafOn=true; requestAnimationFrame(loop); }
}
function spawnSheet(o){   /* distant intra-cloud flash */
  strikes.push({sheet:true, x:o.x, y:o.y, r:o.r??Math.max(W,H)*.55,
    born:performance.now(), dur:o.dur??420, peak:o.peak??.25, phase:rnd(0,10)});
  if(!rafOn){ rafOn=true; requestAnimationFrame(loop); }
}

/* multi-restrike envelope: main hit, then the channel re-ionises */
function envelope(t, s){
  const peaks=[[0,1],[.3,.62],[.58,.4]].slice(0, 1+s.restrikes);
  let e=0;
  for(const [p,amp] of peaks) if(t>=p) e=Math.max(e, amp*Math.exp(-(t-p)*7.5));
  return e*(.82+.18*Math.sin(55*t+s.phase*7));
}

function poly(pts, i0, i1, w, style){
  cx.lineWidth=w; cx.strokeStyle=style;
  cx.beginPath(); cx.moveTo(pts[i0][0], pts[i0][1]);
  for(let i=i0+1;i<=i1;i++) cx.lineTo(pts[i][0], pts[i][1]);
  cx.stroke();
}
function drawChannel(pts, a, s){
  const n=pts.length-1;
  /* taper in three chunks: sky→tip */
  const chunks=[[0,Math.floor(n*.45),1],[Math.floor(n*.45),Math.floor(n*.8),.62],[Math.floor(n*.8),n,.34]];
  cx.shadowColor=`rgba(139,92,246,${a})`; cx.shadowBlur=30*s;
  for(const [i0,i1,f] of chunks) poly(pts,i0,i1, 8.5*s*f, `rgba(124,58,237,${.32*a})`);
  cx.shadowBlur=0;
  for(const [i0,i1,f] of chunks) poly(pts,i0,i1, 3.4*s*f, `rgba(200,180,255,${.75*a})`);
  for(const [i0,i1,f] of chunks) poly(pts,i0,i1, 1.35*s*f, `rgba(255,255,255,${a})`);
}
function loop(now){
  cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  cx.lineCap='round'; cx.lineJoin='round';
  strikes = strikes.filter(s=>{
    const t=(now-s.born)/s.dur;
    if(t>=1) return false;
    if(s.sheet){
      const a = s.peak*Math.exp(-t*5)*(.8+.2*Math.sin(40*t+s.phase));
      const g = cx.createRadialGradient(s.x,s.y,0, s.x,s.y,s.r);
      g.addColorStop(0,`rgba(167,139,250,${a})`);
      g.addColorStop(.5,`rgba(124,58,237,${a*.4})`);
      g.addColorStop(1,'rgba(124,58,237,0)');
      cx.fillStyle=g; cx.fillRect(0,0,W,H);
      return true;
    }
    const a = envelope(t,s)*s.peak;
    if(a>.01){
      drawChannel(s.pts, a, s.scale);
      for(const b of s.brs) drawChannel(b, a*.5, s.scale*.5);
    }
    return true;
  });
  cx.globalCompositeOperation='source-over';
  if(strikes.length){ requestAnimationFrame(loop); } else rafOn=false;
}

/* strike factories */
function skyBolt({x=.5, scale=1, peak=1, restrikes=2, drift=.14}={}){
  spawn({x0:x*W+rnd(-30,30), y0:-40,
         x1:(x+rnd(-drift,drift))*W, y1:rnd(.55,.8)*H,
         scale, peak, restrikes, branches:Math.round(6*scale)+2});
}
function tearBolt({peak=1}={}){        /* the sign rips the sky open sideways */
  const y=H*.46;
  spawn({x0:W/2, y0:y, x1:-60,  y1:y+rnd(-90,90), rough:.11, scale:.9, peak, restrikes:2, branches:5});
  spawn({x0:W/2, y0:y, x1:W+60, y1:y+rnd(-90,90), rough:.11, scale:.9, peak, restrikes:2, branches:5});
  spawnSheet({x:W/2, y, r:Math.max(W,H)*.4, peak:.3});
}
function sparkArc(){                    /* fingertip contact */
  const y=H*.5;
  spawn({x0:W/2-40, y0:y, x1:W/2+40, y1:y+rnd(-10,10), rough:.3, iters:5,
         scale:.3, peak:.9, restrikes:1, branches:3, dur:380});
}

/* ambient storm — distant strikes & sheet flashes while the storm rages */
if (!reduceMotion){
  setInterval(()=>{
    if(stormLevel<=0) return;
    const r=Math.random();
    if(r < stormLevel*.22)
      spawnSheet({x:rnd(.1,.9)*W, y:rnd(.05,.35)*H, peak:rnd(.1,.22)*stormLevel});
    if(r > 1 - stormLevel*.12)
      skyBolt({x:rnd(.05,.95), scale:rnd(.35,.6), peak:rnd(.25,.45)*stormLevel, restrikes:1});
  }, 230);
}

/* embers */
if (!reduceMotion){
  const field = document.getElementById('emberField');
  for (let i=0;i<22;i++){
    const e=document.createElement('div'); e.className='ember';
    e.style.left=Math.random()*100+'%'; e.style.top=60+Math.random()*40+'%';
    field.appendChild(e);
    gsap.to(e,{y:-(220+Math.random()*420), x:(Math.random()-.5)*120,
      opacity:gsap.utils.random(.2,.7), duration:gsap.utils.random(5,11),
      repeat:-1, delay:Math.random()*8, ease:'none',
      onRepeat(){ e.style.left=Math.random()*100+'%'; }});
  }
}

/* ════════ master scroll timeline ════════ */
const END = 6200;
const tl = gsap.timeline({
  defaults:{ease:'none'},
  scrollTrigger:{
    trigger:'#stage', start:'top top', end:'+='+END,
    scrub: reduceMotion ? false : 0.7,
    pin:true, anticipatePin:1
  }
});
gsap.to('#progress',{scaleX:1,ease:'none',
  scrollTrigger:{trigger:'#stage',start:'top top',end:'+='+END,scrub:true}});
gsap.to('#hint',{autoAlpha:0,
  scrollTrigger:{trigger:'#stage',start:'2% top',end:'6% top',scrub:true}});

/* choreographed strike = canvas bolt + screen flash + thunder-clap shake */
function strike(t, fire, {flash=.5, kick=8}={}){
  if(!reduceMotion) tl.call(fire, null, t);
  if(flash>0){
    tl.set('#flash',{opacity:flash}, t)
      .to('#flash',{opacity:0,duration:.28}, t+.04);
  }
  if(kick>0){
    tl.to('#shaker',{keyframes:[
      {x:-kick,y:kick*.6},{x:kick*.8,y:-kick*.7},{x:-kick*.5,y:-kick*.3},{x:0,y:0}
    ],duration:.42}, t+.01);
  }
}
const setStorm = (t,v)=> tl.call(()=>{stormLevel=v;}, null, t);

/* HERO dissolves */
tl.to('#s-landing',{opacity:0,duration:.8},0.35)
  .to('#s-landing .inner',{scale:1.35,filter:'blur(10px)',duration:.8},0.35)
  .to('#heroVid',{scale:1.12,duration:.8},0.35)
  .call(()=>{const v=document.getElementById('heroVid'); if(v) v.paused||v.pause();},null,1.3)
  .call(()=>{const v=document.getElementById('heroVid'); if(v && v.style.display!=='none') v.play().catch(()=>{});},null,1.0);

/* ── FLOW 1 · hands slide together, the arc completes ── */
tl.fromTo('#handL',{x:'-58vw',opacity:0},{x:'0vw',opacity:1,duration:1.7,ease:'power1.out'},0.9)
  .fromTo('#handR',{x:'58vw', opacity:0},{x:'0vw',opacity:1,duration:1.7,ease:'power1.out'},0.9)
  .fromTo('#focusTxt',{opacity:0,letterSpacing:'1.5em'},
                      {opacity:1,letterSpacing:'.7em',duration:.7},1.3)
  .to('#focusTxt',{opacity:0,duration:.35},2.2);
strike(2.6, sparkArc, {flash:.35, kick:3});

/* ── FLOW 2 · the sign forms — the WHOLE SKY thunders ── */
tl.to('#handsPair',{opacity:0,scale:1.15,filter:'blur(8px)',duration:.6},2.95)
  .fromTo('#signWrap',{opacity:0,scale:.66,filter:'blur(14px)'},
                      {opacity:1,scale:1,filter:'blur(0px)',duration:.8},3.15)
  .fromTo('#signCaption',{opacity:0,letterSpacing:'1.7em'},
                         {opacity:1,letterSpacing:'.85em',duration:.6},3.7);

setStorm(3.5, 1);
tl.to('#stormGlow',{opacity:1,duration:.8},3.5)
  .to('#stormGlow',{opacity:.45,duration:.25},4.15)
  .to('#stormGlow',{opacity:1,duration:.2},4.4)
  .to('#stormGlow',{opacity:.55,duration:.3},4.9)
  .to('#stormGlow',{opacity:1,duration:.25},5.2);

/* the barrage — every quadrant gets hit */
strike(3.70, ()=>tearBolt({peak:1}),                                    {flash:.6,  kick:9});
strike(3.95, ()=>skyBolt({x:.16, scale:1.15, peak:1, restrikes:3}),     {flash:.6,  kick:8});
strike(4.15, ()=>skyBolt({x:.84, scale:1.1,  peak:1, restrikes:3}),     {flash:.55, kick:8});
strike(4.35, ()=>skyBolt({x:.5,  scale:1.35, peak:1, restrikes:3}),     {flash:.7,  kick:11});
strike(4.55, ()=>{skyBolt({x:.07,scale:.75,peak:.8}); skyBolt({x:.93,scale:.75,peak:.8});}, {flash:.4, kick:6});
strike(4.75, ()=>tearBolt({peak:.9}),                                   {flash:.55, kick:8});
strike(4.95, ()=>skyBolt({x:.3,  scale:.9,  peak:.85}),                 {flash:.35, kick:5});
strike(5.10, ()=>skyBolt({x:.68, scale:.95, peak:.9, restrikes:3}),     {flash:.4,  kick:6});
strike(5.26, ()=>skyBolt({x:.5,  scale:.8,  peak:.8}),                  {flash:.35, kick:5});
tl.to('#signImg',{filter:'drop-shadow(0 0 70px rgba(196,181,253,.9))',duration:.12},4.35)
  .to('#signImg',{filter:'drop-shadow(0 0 40px rgba(124,58,237,.4))',duration:.35},4.6);

/* ── FLOW 3 · the domain opens over the storm ── */
setStorm(5.45, .55);
tl.to('#signWrap',{scale:.3,y:'30vh',opacity:0,duration:1.1,ease:'power1.in'},5.45)
  .to('#signCaption',{opacity:0,duration:.25},5.45)
  .fromTo('#templeWrap',{opacity:0,y:'42vh',scale:.86},
                        {opacity:1,y:'0vh',scale:1,duration:1.9},5.55)
  .fromTo('#sukunaWrap',{opacity:0,y:'50vh'},
                        {opacity:1,y:'0vh',duration:1.6},6.0)
  .to('#flash',{opacity:.55,duration:.08},6.05)
  .to('#flash',{opacity:0,duration:.4},6.14);
strike(6.45, ()=>skyBolt({x:.85, scale:1,  peak:.85, restrikes:3}), {flash:.4, kick:5});
strike(6.85, ()=>skyBolt({x:.13, scale:.85,peak:.7}),               {flash:.25,kick:3});
strike(7.35, ()=>skyBolt({x:.6,  scale:.9, peak:.75, restrikes:3}), {flash:.35,kick:4});
tl.fromTo('#titleWrap',{opacity:0,x:-80,rotate:-3},
                       {opacity:1,x:0,rotate:0,duration:1.0},7.0)
  .fromTo('#cta',{opacity:0,y:26},{opacity:1,y:0,duration:.7},7.6)
  .to('#templeWrap',{y:'-3vh',duration:1.4},7.8)
  .to('#sukunaWrap',{y:'-6vh',duration:1.4},7.8)
  .to('#titleWrap',{y:-16,duration:1.4},7.8);
setStorm(8.55, .4);

gsap.set('#sukunaWrap',{xPercent:-50});
gsap.set('#templeWrap',{xPercent:-50});

document.getElementById('cta').addEventListener('click',()=>{
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
